# Application Configuration
spring.application.name=careerroadmap

# Server Configuration
server.port={PORT_NO:10000}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Student}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT & Cookie Configuration
jwt.secret=${JWT_SECRET:HbfIjU2f/1l8BVUc/WxVMqUAik3fSKp3jEzx5GlDTUs=}
jwt.expiration=86400000
jwt.cookie-name=career_jwt
jwt.cookie-secure=false
jwt.cookie-same-site=Lax

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Resume storage directory
app.upload.dir=uploads/resumes
cloudinary.cloud.name=${CLOUD_NAME}
cloudinary.api.key=${CLOUD_API}
cloudinary.api.secret=${CLOUD_SECRET_KEY}
ai.service.url=${AI_SERVICE:http://localhost:8000}
